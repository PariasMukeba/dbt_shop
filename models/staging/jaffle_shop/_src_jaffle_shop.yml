version: 2

sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    description: A clone of Postgres app database
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: Primary Key for the customer data
            data_tests:
              - unique
              - not_null
              
      - name: customers_test
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: Primary Key for the order data
            data_tests:
              - unique
              - not_null
              
      - name: products
      
      
      